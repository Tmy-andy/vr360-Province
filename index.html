<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bản Đồ Du Lịch VR360 – Lâm Đồng</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/views-shared.css" />
  <link rel="stylesheet" href="css/guide.css" />
  <link rel="stylesheet" href="css/invest.css" />
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="ltitle">VR360 · Lâm Đồng</div>
  <div class="spin"></div>
  <p data-i18n="loading">Đang tải bản đồ…</p>
</div>

<!-- ===== 2D MODE UI ===== -->

<!-- TOP BAR (2D mode) -->
<header id="topbar">
  <button id="menu-btn" title="Ẩn/hiện giao diện">
    <svg class="icon-bars" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <div id="search-wrap">
    <div id="search-bar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="text" placeholder="Tìm kiếm địa điểm…" autocomplete="off" />
    </div>
    <div id="search-results"></div>
  </div>
  <div id="xa-dd" class="custom-dd">
    <button type="button" class="filter-pill xa-trigger">
      <span id="xa-current" data-i18n="filter.area_all">Xã/Phường (Tất cả)</span>
      <svg class="xa-caret" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg>
    </button>
    <div class="xa-popup">
      <div class="xa-search"><input type="text" id="xa-search-input" /></div>
      <div class="xa-list" id="xa-list"></div>
    </div>
  </div>
  <div id="top-right">
    <button class="ticon" id="lang-btn" title="Đổi ngôn ngữ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
      <span id="lang-label">VI</span>
    </button>
    <button class="ticon" id="three-d-btn" title="Xem VR 360°">3D</button>
    <button class="ticon" id="fs-btn" title="Toàn màn hình">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
    </button>
    <button class="ticon" id="zoom-in-btn" title="Phóng to" onclick="map.zoomIn()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="ticon" id="zoom-out-btn" title="Thu nhỏ" onclick="map.zoomOut()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="ticon" id="layers-btn" title="Layers">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
    </button>
    <button class="ticon" id="invest-layer-btn" title="Hiện/ẩn dự án đầu tư + KCN">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    </button>
  </div>
</header>

<!-- LAYER POPUP -->
<div id="layer-popup">
  <div id="layer-popup-title" data-i18n="layers.title">Lớp bản đồ</div>
  <div class="layer-option active" data-layer="satellite">
    <div class="layer-thumb"><img src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/5/12/24" alt="" /></div>
    <div><div class="layer-label">Vệ tinh</div><div class="layer-sub">ESRI World Imagery</div></div>
  </div>
  <div class="layer-option" data-layer="street">
    <div class="layer-thumb"><img src="https://tile.openstreetmap.org/5/24/12.png" alt="" /></div>
    <div><div class="layer-label">Đường phố</div><div class="layer-sub">OpenStreetMap</div></div>
  </div>
  <div class="layer-option" data-layer="topo">
    <div class="layer-thumb"><img src="https://tile.opentopomap.org/5/24/12.png" alt="" /></div>
    <div><div class="layer-label">Địa hình</div><div class="layer-sub">OpenTopoMap</div></div>
  </div>
  <div class="layer-option" data-layer="dark">
    <div class="layer-thumb"><img src="https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/5/24/12.png" alt="" /></div>
    <div><div class="layer-label">Tối</div><div class="layer-sub">CartoDB Dark</div></div>
  </div>
</div>

<!-- MOBILE: nút "more" gom các icon top-right + left-bar (chỉ hiện trên mobile) -->
<button id="mobile-more-btn" title="Mở thực đơn">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
</button>

<!-- MOBILE: nút mở right-panel full screen (chỉ hiện trên mobile, dưới #menu-btn) -->
<button id="mobile-panel-btn" title="Danh sách địa điểm">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-icon lucide-map"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>
</button>

<!-- LEFT TOOLBAR -->
<div id="left-bar">
  <button class="lbtn" id="help-btn" title="Trợ giúp">?</button>
  <button class="lbtn" id="news-btn" title="Tin tức & Sự kiện">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
  </button>
  <button class="lbtn" title="Tài khoản">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </button>
</div>

<!-- MAP (Leaflet) -->
<div id="map"></div>

<!-- PANEL TOGGLE -->
<button id="panel-toggle" class="closed">
  <svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#999" stroke-width="1.8" stroke-linecap="round"><polyline points="6,1 2,6 6,11"/></svg>
</button>

<!-- RIGHT PANEL -->
<div id="right-panel-bg"></div>
<aside id="right-panel">
  <div id="ph">
    <div id="ph-top">
      <button id="ph-close" title="Đóng">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div id="ph-title" data-i18n="panel.title">Lâm Đồng</div>
      <div id="ph-search">
        <input type="text" id="ph-input" placeholder="Tìm kiếm địa điểm…" />
        <svg id="ph-search-btn" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
    </div>
    <div id="ph-xa-dd" class="custom-dd">
      <button type="button" class="filter-pill xa-trigger">
        <span id="ph-xa-current">Xã/Phường (Tất cả)</span>
        <svg class="xa-caret" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg>
      </button>
      <div class="xa-popup">
        <div class="xa-search"><input type="text" id="ph-xa-search-input" /></div>
        <div class="xa-list" id="ph-xa-list"></div>
      </div>
    </div>
    <div id="ph-cats">
      <button class="pcat active" data-cat="all">Tất cả</button>
      <button class="pcat" data-cat="thac">Thác nước</button>
      <button class="pcat" data-cat="ho">Hồ</button>
      <button class="pcat" data-cat="nui">Núi</button>
      <button class="pcat" data-cat="di-tich">Di tích</button>
      <button class="pcat" data-cat="lang">Làng sinh thái</button>
    </div>
  </div>
  <div id="p-count">12 địa điểm</div>
  <div id="p-list"></div>
</aside>

<!-- HELP TOUR: spotlight overlay + tooltip có mũi tên -->
<div id="tour-overlay">
  <div id="tour-spot"></div>
  <div id="tour-tip">
    <div class="tt-arrow"></div>
    <div class="tt-step"></div>
    <div class="tt-label"></div>
    <div class="tt-hint">Click bất kỳ đâu để tiếp tục →</div>
    <button id="tour-skip" title="Bỏ qua">×</button>
  </div>
</div>

<!-- NEWS PANEL (left side, opened by left-bar's Sự kiện button) -->
<aside id="news-panel">
  <div id="np-header">
    <button id="np-back" title="Đóng">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div id="np-title">Tin tức</div>
    <div id="np-date"></div>
  </div>
  <div id="np-tabs">
    <button class="np-tab active" data-tab="news">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12v16H4z"/><path d="M16 8h4v12a2 2 0 01-2 2H6"/><line x1="7" y1="8" x2="13" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/><line x1="7" y1="16" x2="11" y2="16"/></svg>
      <span>Tin tức</span>
    </button>
    <button class="np-tab" data-tab="events">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
      <span>Sự kiện</span>
    </button>
  </div>
  <div id="np-list"></div>
</aside>

<!-- BOTTOM BAR -->
<nav id="bottom-bar">
  <span id="bb-indicator"></span>
  <button class="bbt active" data-view="map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="bb-label" data-i18n="nav.home">Trang chủ</span>
  </button>
  <button class="bbt" data-view="guide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span class="bb-label" data-i18n="nav.guide">Cẩm nang</span>
  </button>
  <button class="bbt bb-ai" id="bb-ai-btn" title="AI Hỗ trợ – Hỏi tôi về địa điểm này">
    <span class="ai-tip">Hỏi tôi về địa điểm này</span>
    <span class="ai-waves" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </span>
    <span class="ai-orb">
      <svg class="ai-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
    </span>
    <span class="bb-label">AI Hỗ trợ</span>
  </button>
  <button class="bbt" data-view="invest">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
    <span class="bb-label" data-i18n="nav.invest">Đầu tư</span>
  </button>
  <button class="bbt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    <span class="bb-label">VR Tour</span>
  </button>
</nav>

<!-- ===== GUIDE / INVEST MOUNT + TEMPLATES =====
     Partials nhúng trực tiếp dạng <template> vì VS Code Live Server
     làm hỏng response của file partial khi inject script live-reload
     (cắt giữa SVG, truncate body). pages/guide.html + pages/invest.html
     vẫn giữ làm bản chuẩn nhưng KHÔNG còn fetch lúc runtime.
     Khi sửa nội dung partial: sửa cả file pages/* lẫn template ở đây
     (hoặc copy paste lại cho đồng bộ). ============================== -->
<div id="guide-mount"></div>
<div id="invest-mount"></div>

<template id="tpl-guide-view">
<section id="guide-view">
  <div id="gv-shell">
    <header class="view-topbar">
      <button class="vt-brand" type="button" data-view-home="guide" title="Về Cẩm nang">
        <span class="vt-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/><line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/><line x1="4.93" y1="19.07" x2="7.05" y2="16.95"/><line x1="16.95" y1="7.05" x2="19.07" y2="4.93"/></svg>
        </span>
        <span class="vt-brand-text">
          <span class="vt-brand-name">LÂM ĐỒNG</span>
          <span class="vt-brand-sub">TINH HOA CAO NGUYÊN</span>
        </span>
      </button>
      <div class="vt-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="gv-search" type="text" data-i18n-placeholder="guide.search.placeholder" placeholder="Tìm kiếm cẩm nang…" autocomplete="off" />
      </div>
      <button class="vt-icon-btn" id="gv-lang-btn" title="Đổi ngôn ngữ" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
        <span id="gv-lang-label">VI</span>
      </button>
    </header>
    <div class="view-body">
      <aside id="gv-sidebar" aria-label="Chủ đề cẩm nang">
        <div class="gv-side-title" data-i18n="guide.sidebar.title">CHỦ ĐỀ CẨM NANG</div>
        <div id="gv-side-list"></div>
        <button id="gv-pdf-btn" class="gv-pdf" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span data-i18n="guide.pdf">Tải cẩm nang PDF</span>
        </button>
      </aside>
      <main id="gv-main">
        <div id="gv-content"></div>
      </main>
    </div>
  </div>
</section>
</template>

<template id="tpl-invest-view">
<section id="invest-view">
  <div id="iv-shell">
    <header class="view-topbar">
      <button class="vt-brand" type="button" data-view-home="invest" title="Về Đầu tư">
        <span class="vt-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/><line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/><line x1="4.93" y1="19.07" x2="7.05" y2="16.95"/><line x1="16.95" y1="7.05" x2="19.07" y2="4.93"/></svg>
        </span>
        <span class="vt-brand-text">
          <span class="vt-brand-name">LÂM ĐỒNG</span>
          <span class="vt-brand-sub">TINH HOA CAO NGUYÊN</span>
        </span>
      </button>
      <div class="vt-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="iv-search" type="text" data-i18n-placeholder="invest.search.placeholder" placeholder="Tìm dự án, lĩnh vực…" autocomplete="off" />
      </div>
      <button class="vt-icon-btn" id="iv-lang-btn" title="Đổi ngôn ngữ" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
        <span id="iv-lang-label">VI</span>
      </button>
    </header>
    <div class="view-body">
      <aside id="iv-sidebar" aria-label="Lĩnh vực ưu tiên">
        <div class="iv-side-title" data-i18n="invest.sidebar.title">LĨNH VỰC ƯU TIÊN</div>
        <div id="iv-side-list"></div>
        <div class="iv-side-actions">
          <button id="iv-dashboard-btn" class="iv-side-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            <span>Dashboard số liệu</span>
          </button>
          <button id="iv-pdf-btn" class="iv-side-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span data-i18n="invest.cta.download">Tải Cẩm nang Đầu tư</span>
          </button>
          <button id="iv-contact-btn" class="iv-side-btn primary" type="button">

<!-- ===== 3D MODE UI ===== -->

<!-- VR VIEWER (Pannellum) -->
<div id="vr-viewer">
  <div id="vr-pannellum"></div>

  <!-- 3D overlay UI -->
  <div id="vr-ui">

    <!-- TOP HEADER -->
    <header id="vr-hd">
      <!-- Logo -->
      <div id="vr-logo">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
          <rect width="44" height="44" rx="10" fill="rgba(255,255,255,0.12)"/>
          <!-- Cloud -->
          <path d="M10 26a6 6 0 016-6 5.98 5.98 0 0110.2-4.3A5 5 0 0134 21a5 5 0 010 10H10z" fill="rgba(255,255,255,0.85)"/>
          <!-- Mountain peaks -->
          <path d="M8 34l8-12 6 8 5-7 9 11H8z" fill="rgba(34,180,110,0.9)"/>
        </svg>
        <div>
          <div class="vr-logo-title">LÂM ĐỒNG 360°</div>
          <div class="vr-logo-sub">KHÁM PHÁ TÂY NGUYÊN</div>
        </div>
      </div>

      <!-- Location selector: custom dropdown giống 2D filter-pill -->
      <div id="vr-loc-dd">
        <button type="button" id="vr-loc-trigger">
          <svg class="vr-loc-pin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 017 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 017-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <span id="vr-loc-current"></span>
          <svg class="vr-loc-caret" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg>
        </button>
        <button type="button" id="vr-loc-collapse" title="Thu gọn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
        <div id="vr-loc-popup">
          <div id="vr-loc-list"></div>
        </div>
      </div>

      <!-- Right controls: glass dark buttons, cùng sizing với 2D ticon -->
      <div id="vr-hd-right">
        <!-- Lang: giống #lang-btn 2D – pill + globe icon + mã ngôn ngữ -->
        <button class="vr-icon-btn vr-pill-btn" id="vr-lang-btn" title="Đổi ngôn ngữ">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
          <span id="vr-lang-label">VI</span>
        </button>
        <button class="vr-icon-btn" id="vr-vol-btn" title="Âm thanh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <button class="vr-icon-btn" id="vr-share-btn" title="Chia sẻ">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
        <button class="vr-icon-btn" id="vr-help-btn" title="Trợ giúp">?</button>
        <!-- Back to 2D: nổi bật hơn với màu xanh -->
        <button class="vr-icon-btn vr-pill-btn vr-back-btn" id="vr-back-btn" title="Về bản đồ 2D">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          2D
        </button>
      </div>
    </header>

    <!-- INFO PANEL: bottom-left, absolute positioned -->
    <div id="vr-info">
      <div id="vr-info-hd">
        <div class="vr-info-tag">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12" stroke="white" stroke-width="2"/><line x1="12" y1="16" x2="12.01" y2="16" stroke="white" stroke-width="2"/></svg>
          THÔNG TIN ĐIỂM ĐẾN:
        </div>
        <button id="vr-info-x" title="Thu gọn / mở rộng">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
      <div id="vr-place-name"></div>
      <div id="vr-place-desc"></div>
      <div id="vr-place-meta">
        <div class="vr-meta-row"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="vr-meta-hours"></span></div>
        <div class="vr-meta-row"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span id="vr-meta-rating"></span></div>
        <div class="vr-meta-row"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg><span id="vr-meta-entry"></span></div>
      </div>
    </div>

    <!-- Mobile FAB: chỉ hiện khi #vr-info collapsed (mobile) -->
    <button id="vr-info-fab" title="Mở thông tin">i</button>

    <!-- BOTTOM CENTER: Controls – absolute, centered on full viewport -->
    <div id="vr-bottom">
      <!-- Controls toolbar -->
      <div id="vr-ctrl">
        <button class="vr-ctrl-btn" id="vr-autorot">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
          <span>Auto-rotate</span>
        </button>
        <button class="vr-ctrl-btn" id="vr-zout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          <span>Zoom out</span>
        </button>
        <button class="vr-ctrl-btn" id="vr-hideui">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Hide UI</span>
        </button>
        <button class="vr-ctrl-btn" id="vr-zin">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          <span>Zoom in</span>
        </button>
        <button class="vr-ctrl-btn" id="vr-fullscr">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
          <span>Fullscreen</span>
        </button>
      </div>
    </div>

  </div><!-- #vr-ui -->

  <!-- Nút hiện lại UI – chỉ xuất hiện khi UI bị ẩn, nằm ngoài #vr-ui -->
  <button id="vr-reveal-btn" title="Hiện giao diện">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div><!-- #vr-viewer -->

<!-- MINIMAP – circular compass, click to return to 2D -->
<div id="minimap" title="Nhấn để quay về bản đồ 2D">
  <div id="mm-title">Minimap</div>
  <div id="mm-circle">
    <div id="minimap-map"></div>
    <!-- SVG overlay: FOV sector + compass -->
    <svg id="mm-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- FOV sector – JS updates the path "d" attribute -->
      <path id="fov-sector" fill="rgba(43,182,230,0.38)" stroke="#2bb6e6" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Outer ring -->
      <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <!-- Crosshair -->
      <line x1="100" y1="8" x2="100" y2="192" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="8" y1="100" x2="192" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <!-- Compass ticks -->
      <line x1="100" y1="10" x2="100" y2="18" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
      <line x1="100" y1="182" x2="100" y2="190" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="10" y1="100" x2="18" y2="100" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="182" y1="100" x2="190" y2="100" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <!-- Compass labels -->
      <text x="100" y="8" text-anchor="middle" dominant-baseline="hanging" fill="white" font-size="11" font-weight="700" font-family="'Be Vietnam Pro',sans-serif">N</text>
      <text x="100" y="196" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-size="9" font-family="'Be Vietnam Pro',sans-serif">S</text>
      <text x="196" y="104" text-anchor="end" fill="rgba(255,255,255,0.55)" font-size="9" font-family="'Be Vietnam Pro',sans-serif">E</text>
      <text x="4" y="104" text-anchor="start" fill="rgba(255,255,255,0.55)" font-size="9" font-family="'Be Vietnam Pro',sans-serif">W</text>
      <!-- Center location dot -->
      <circle cx="100" cy="100" r="5" fill="#2bb6e6" stroke="white" stroke-width="2.5"/>
    </svg>
  </div>
</div>
