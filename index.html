<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bản Đồ Du Lịch VR360 – Lâm Đồng</title>

  <!-- ===== THƯ VIỆN NGOÀI ===== -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ===== CSS NỘI BỘ ===== -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ============================================================
     SECTION 1: LOADING – Màn hình chờ khởi động
     ============================================================ -->
<div id="loading">
  <div class="ltitle">VR360 · Lâm Đồng</div>
  <div class="spin"></div>
  <p data-i18n="loading">Đang tải bản đồ…</p>
</div>

<!-- ============================================================
     SECTION 2: TOP BAR – Menu, search, lọc Xã/Phường, layers
     ============================================================ -->
<header id="topbar">
  <button id="menu-btn" data-i18n-title="top.menu" title="Ẩn/hiện giao diện">
    <svg class="icon-bars" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>

  <!-- Ô tìm kiếm -->
  <div id="search-bar">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search-input" type="text" data-i18n-placeholder="search.placeholder" placeholder="Tìm kiếm địa điểm…" autocomplete="off" />
  </div>

  <!-- Select Xã/Phường (giá trị value PHẢI khớp key trong data.json > areas) -->
  <select class="filter-pill" id="xa-select">
    <option value="" data-i18n="filter.area_all">Xã/Phường (Tất cả)</option>
    <option value="dalat">TP. Đà Lạt</option>
    <option value="lacdong">Lạc Dương</option>
    <option value="donduong">Đơn Dương</option>
    <option value="lamha">Lâm Hà</option>
    <option value="ductröng">Đức Trọng</option>
    <option value="baolon">Bảo Lộc</option>
    <option value="catien">Cát Tiên</option>
    <option value="dalinh">Đà Lạt (huyện ngoại ô)</option>
  </select>

  <button id="more-btn">
    <span data-i18n="buttons.more">Xem Thêm</span>
    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  <!-- Cụm icon bên phải topbar (kiểu nút tròn xanh nổi) -->
  <div id="top-right">
    <!-- Nút chuyển ngôn ngữ: hiển thị mã ngôn ngữ hiện tại, click để toggle -->
    <button class="ticon" id="lang-btn" data-i18n-title="top.lang" title="Đổi ngôn ngữ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
      <span id="lang-label">VI</span>
    </button>
    <button class="ticon active" id="three-d-btn" data-i18n-title="top.3d" title="3D">3D</button>
    <button class="ticon" id="fs-btn" data-i18n-title="top.locate" title="Vị trí của tôi">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
    </button>
    <button class="ticon" data-i18n-title="top.zoom_in" title="Phóng to" onclick="map.zoomIn()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="ticon" data-i18n-title="top.zoom_out" title="Thu nhỏ" onclick="map.zoomOut()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="ticon" id="layers-btn" data-i18n-title="top.layers" title="Layers">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
    </button>
  </div>
</header>

<!-- ============================================================
     SECTION 3: LAYER POPUP – Chọn lớp bản đồ
     (data-layer phải khớp key trong data.json > layers)
     ============================================================ -->
<div id="layer-popup">
  <div id="layer-popup-title" data-i18n="layers.title">Lớp bản đồ</div>
  <div class="layer-option active" data-layer="satellite">
    <div class="layer-thumb"><img src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/5/12/24" alt="" /></div>
    <div><div class="layer-label" data-i18n="layers.satellite">Vệ tinh</div><div class="layer-sub" data-i18n="layers.satellite_sub">ESRI World Imagery</div></div>
  </div>
  <div class="layer-option" data-layer="street">
    <div class="layer-thumb"><img src="https://tile.openstreetmap.org/5/24/12.png" alt="" /></div>
    <div><div class="layer-label" data-i18n="layers.street">Đường phố</div><div class="layer-sub" data-i18n="layers.street_sub">OpenStreetMap</div></div>
  </div>
  <div class="layer-option" data-layer="topo">
    <div class="layer-thumb"><img src="https://tile.opentopomap.org/5/24/12.png" alt="" /></div>
    <div><div class="layer-label" data-i18n="layers.topo">Địa hình</div><div class="layer-sub" data-i18n="layers.topo_sub">OpenTopoMap</div></div>
  </div>
  <div class="layer-option" data-layer="dark">
    <div class="layer-thumb"><img src="https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/5/24/12.png" alt="" /></div>
    <div><div class="layer-label" data-i18n="layers.dark">Tối</div><div class="layer-sub" data-i18n="layers.dark_sub">CartoDB Dark</div></div>
  </div>
</div>

<!-- ============================================================
     SECTION 4: LEFT TOOLBAR – Help / Sự kiện / Tài khoản
     ============================================================ -->
<div id="left-bar">
  <button class="lbtn" data-i18n-title="left.help" title="Trợ giúp">?</button>
  <button class="lbtn" data-i18n-title="left.events" title="Sự kiện">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
  </button>
  <button class="lbtn" data-i18n-title="left.account" title="Tài khoản">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </button>
</div>

<!-- ============================================================
     SECTION 5: MAP – Container Leaflet
     ============================================================ -->
<div id="map"></div>

<!-- ============================================================
     SECTION 6: PANEL TOGGLE – Nút mở/đóng panel phải
     ============================================================ -->
<button id="panel-toggle">
  <svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#999" stroke-width="1.8" stroke-linecap="round"><polyline points="6,1 2,6 6,11"/></svg>
</button>

<!-- ============================================================
     SECTION 7: RIGHT PANEL – Danh sách địa điểm + filter danh mục
     (data-cat phải khớp `cat` trong data.json > places)
     ============================================================ -->
<aside id="right-panel">
  <div id="ph">
    <div id="ph-top">
      <div id="ph-title" data-i18n="panel.title">Lâm Đồng</div>
      <div id="ph-search">
        <input type="text" id="ph-input" data-i18n-placeholder="panel.search" placeholder="Tìm kiếm địa điểm…" />
        <svg id="ph-search-btn" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
    </div>
    <div id="ph-cats">
      <button class="pcat active" data-cat="all" data-i18n="cat.all">Tất cả</button>
      <button class="pcat" data-cat="thac" data-i18n="cat.thac">Thác nước</button>
      <button class="pcat" data-cat="ho" data-i18n="cat.ho">Hồ</button>
      <button class="pcat" data-cat="nui" data-i18n="cat.nui">Núi</button>
      <button class="pcat" data-cat="di-tich" data-i18n="cat.di-tich">Di tích</button>
      <button class="pcat" data-cat="lang" data-i18n="cat.lang">Làng sinh thái</button>
    </div>
  </div>
  <div id="p-count">12 địa điểm</div>
  <div id="p-list"></div>
</aside>

<!-- ============================================================
     SECTION 8: BOTTOM SHEET – Chi tiết địa điểm
     ============================================================ -->
<div id="sheet">
  <div id="sheet-handle"></div>
  <div id="sheet-body">
    <!-- Khung VR thu nhỏ. iframe được set src trong openSheet().
         Overlay phía trên bắt double-click để mở VR fullscreen
         (iframe nuốt event nên cần overlay trong suốt). -->
    <div id="s-img-wrap" title="Bấm đúp để xem toàn màn hình">
      <iframe id="s-img" src="" allow="vr; gyroscope; accelerometer"></iframe>
      <div id="s-img-overlay"></div>
    </div>
    <div id="s-name"></div>
    <div id="s-loc">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 017 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 017-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      <span id="s-loc-txt"></span>
    </div>
    <div id="s-desc"></div>
    <div class="s-pills">
      <div class="s-pill"><div class="sl" data-i18n="sheet.hours">Giờ mở cửa</div><div class="sv" id="s-hours"></div></div>
      <div class="s-pill"><div class="sl" data-i18n="sheet.entry">Vé vào cửa</div><div class="sv" id="s-entry"></div></div>
      <div class="s-pill"><div class="sl" data-i18n="sheet.rating">Đánh giá</div><div class="sv" id="s-rating"></div></div>
    </div>
    <div class="s-btns">
      <button id="s-vr">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 6h-17A1.5 1.5 0 002 7.5v9A1.5 1.5 0 003.5 18h17a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0020.5 6zM9 14.5A2.5 2.5 0 116.5 12 2.5 2.5 0 019 14.5zm6 0a2.5 2.5 0 112.5-2.5 2.5 2.5 0 01-2.5 2.5z"/></svg>
        <span data-i18n="buttons.explore_vr">Khám phá VR 360°</span>
      </button>
      <button id="s-close" data-i18n="buttons.close">Đóng</button>
    </div>
  </div>
</div>

<!-- ============================================================
     SECTION 9: BOTTOM BAR – Tab điều hướng dưới (pill floating)
     - Mỗi .bbt có icon + <span class="bb-label">; label chỉ hiện
       ở nút active.
     - Nút active có hình tròn xanh phồng lên trên (CSS ::before).
     ============================================================ -->
<nav id="bottom-bar">
  <!-- Bubble di chuyển: định vị tuyệt đối, JS dịch transform khi click -->
  <span id="bb-indicator"></span>

  <button class="bbt active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="bb-label" data-i18n="nav.home">Trang chủ</span>
  </button>
  <button class="bbt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    <span class="bb-label" data-i18n="nav.explore">Khám phá</span>
  </button>
  <button class="bbt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    <span class="bb-label" data-i18n="nav.contribute">Đóng góp</span>
  </button>
  <button class="bbt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    <span class="bb-label" data-i18n="nav.deals">Ưu đãi</span>
  </button>
  <button class="bbt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    <span class="bb-label" data-i18n="nav.vr_tour">VR Tour</span>
  </button>
</nav>

<!-- ============================================================
     SECTION 10: VR FULLSCREEN – Trình xem 360 độ
     ============================================================ -->
<div id="vr-full">
  <div id="vr-tb">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M20.5 6h-17A1.5 1.5 0 002 7.5v9A1.5 1.5 0 003.5 18h17a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0020.5 6zM9 14.5A2.5 2.5 0 116.5 12 2.5 2.5 0 019 14.5zm6 0a2.5 2.5 0 112.5-2.5 2.5 2.5 0 01-2.5 2.5z"/></svg>
    <span id="vr-title" data-i18n="vr.title">VR 360°</span>
    <button id="vr-x" data-i18n="buttons.exit_vr">✕ Thoát VR</button>
  </div>
  <iframe id="vr-frame" src="" allowfullscreen allow="vr; gyroscope; accelerometer"></iframe>
</div>

<!-- ============================================================
     SCRIPTS – Thứ tự nạp BẮT BUỘC: data → i18n → map → ui → main
     ============================================================ -->
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
